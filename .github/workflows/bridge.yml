name: Bridge Generation

on:
  workflow_call:

jobs:
  bridge:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install flutter
        uses: subosito/flutter-action@v2.12.0
        with:
          channel: "stable"
          flutter-version: "3.24.5"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.75"
          components: "rustfmt"

      - name: Install bridge dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
             llvm-dev libclang-dev clang

      - name: Install flutter rust bridge deps
        shell: bash
        run: |
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features "uuid" --locked
          
      - name: Build bridge for dart
        run: |
          # Prepare Flutter dependencies
          cd flutter
          flutter pub get
          cd ..
          
          # Generate bridge files with verbose output
          flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h \
            --rust-output ./src/bridge_generated.rs
          
          # Copy files to required locations
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h || true
          
          # The Rust bridge file should be generated in src/
          ls -la ./src/bridge_generated* || echo "Checking for bridge files..."
          
          # If bridge_generated.rs doesn't exist in src/, we need to create/copy it
          if [ ! -f "./src/bridge_generated.rs" ]; then
            echo "Warning: bridge_generated.rs not found in src/"
            # Try to find it elsewhere
            find . -name "bridge_generated*.rs" -type f 2>/dev/null || true
          fi

      - name: Upload bridge files
        uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h