name: Bridge Generation

on:
  workflow_call:

jobs:
  bridge:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install flutter
        uses: subosito/flutter-action@v2.12.0
        with:
          channel: "stable"
          flutter-version: "3.24.5"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.75"
          components: "rustfmt"

      - name: Install bridge dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
             llvm-dev libclang-dev clang

      - name: Install flutter rust bridge deps
        shell: bash
        run: |
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features "uuid" --locked
          
      - name: Build bridge for dart
        run: |
          cd flutter
          flutter pub get
          # Generate bridge files directly without script
          flutter_rust_bridge_codegen \
            --rust-input ../src/flutter_ffi.rs \
            --dart-output lib/generated_bridge.dart \
            --c-output generated_bridge.h
          
          # Copy header files
          cp generated_bridge.h frb_generated.h || echo "frb_generated.h not needed"

      - name: Upload bridge files
        uses: actions/upload-artifact@master
        with:
          name: bridge-artifact
          path: |
            ./flutter/generated_bridge.h
            ./flutter/frb_generated.h
            ./flutter/lib/generated_bridge.dart